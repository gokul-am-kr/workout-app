<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><title>Sign in · Platewise</title><style>*{box-sizing:border-box}:root{font-family:-apple-system,BlinkMacSystemFont,system-ui;color-scheme:dark}body{margin:0;background:#000;color:#fff;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:24px}.panel{width:min(100%,410px)}.logo{font-size:20px;font-weight:750;letter-spacing:-.8px}.rings{width:110px;height:110px;margin:45px auto 28px;transform:rotate(-90deg)}h1{font-size:38px;line-height:1.05;letter-spacing:-1.4px;margin:0 0 12px}p{color:#99999d;line-height:1.45;margin:0 0 28px}form{background:#1c1c1e;border-radius:23px;padding:22px}label{display:block;font-size:13px;color:#b1b1b5;margin-bottom:15px}input{display:block;width:100%;background:#2c2c2e;border:1px solid #48484a;color:#fff;border-radius:13px;padding:15px;font-size:16px;margin-top:7px}button{background:#b8ff27;border:0;border-radius:13px;width:100%;padding:16px;font-size:16px;font-weight:750;color:#111;margin-top:7px}button:disabled{opacity:.5}.error{color:#ff496e;font-size:13px;min-height:18px;margin:13px 0 0}.foot{font-size:12px;color:#777;margin-top:20px;text-align:center}</style></head><body><div class="panel"><div class="logo">◉ platewise<span style="color:#b8ff27">.</span></div><svg class="rings" viewBox="0 0 120 120"><circle cx="60" cy="60" r="49" stroke="#302025" stroke-width="12" fill="none"/><circle cx="60" cy="60" r="49" stroke="#ff315d" stroke-width="12" stroke-dasharray="247 307" stroke-linecap="round" fill="none"/><circle cx="60" cy="60" r="31" stroke="#233118" stroke-width="12" fill="none"/><circle cx="60" cy="60" r="31" stroke="#b8ff27" stroke-width="12" stroke-dasharray="139 195" stroke-linecap="round" fill="none"/></svg><h1>Welcome back.</h1><p>Your activity, nutrition and wellness, together.</p><form id="signin"><label>Username<input id="username" autocomplete="username" value="platewise" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Sign in</button><div id="error" class="error" role="alert"></div></form><div class="foot">Secure personal tracking · Stay signed in for 30 days</div></div><script>document.getElementById('signin').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),error=document.getElementById('error');error.textContent='';btn.disabled=true;try{const res=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!res.ok)throw Error('Incorrect username or password');location.replace('/')}catch(e){error.textContent=e.message;btn.disabled=false}});</script></body></html>
