<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171916"><meta name="apple-mobile-web-app-capable" content="yes"><title>Sign in · Platewise</title><style>
*{box-sizing:border-box}:root{font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;color-scheme:dark}body{margin:0;background:#171916;color:#f4f1e9;min-height:100dvh;display:grid;place-items:center;padding:32px 24px;background-image:radial-gradient(ellipse at 80% 0,#34392a55,transparent 65%)}.panel{width:min(100%,410px)}.brand{display:flex;gap:11px;align-items:center;font-size:22px;font-weight:750;letter-spacing:-.8px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;background:#edb86f;color:#22271f;border-radius:12px}.brand-mark svg{width:28px;height:28px}.brand-dot{color:#edb86f}.brand small{display:block;font-size:9px;letter-spacing:3px;color:#a6ac9f;margin-top:2px}.intro{margin:55px 0 26px}.eyebrow{font-size:10px;letter-spacing:2px;color:#b6bcae;font-weight:700}h1{font-size:42px;line-height:1.12;letter-spacing:-1.8px;margin:15px 0}h1 em{font-family:Georgia,serif;font-weight:400;color:#d9dcbf}p{color:#a9afa2;line-height:1.6;font-size:14px}form{background:#22261f;border:1px solid #363d30;border-radius:20px;padding:24px}label{display:block;font-size:12px;color:#c8cdbc;margin-bottom:18px}input{display:block;width:100%;background:#191d17;border:1px solid #454e3d;color:#f4f1e9;border-radius:10px;padding:14px;font-size:16px;margin-top:8px}button{background:#edb86f;border:0;border-radius:10px;width:100%;padding:15px;font:700 15px "Avenir Next",sans-serif;color:#272318;margin-top:3px;cursor:pointer}button:disabled{opacity:.5}input:focus-visible,button:focus-visible{outline:2px solid #edb86f;outline-offset:3px}.error{color:#f3aaa0;font-size:13px;min-height:18px;margin:13px 0 0}.foot{font-size:11px;color:#a6ad9e;margin-top:22px;text-align:center}
</style></head><body><div class="panel"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 24V8h9a6 6 0 0 1 0 12h-4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="m17 25 4-4 4 4" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>platewise<span class="brand-dot">.</span><small>PULSE</small></span></div><div class="intro"><div class="eyebrow">A SPACE FOR YOUR EVERYDAY</div><h1>Find your<br><em>daily rhythm.</em></h1><p>Food, movement and small rituals.<br>Make a little room for yourself.</p></div><form id="signin"><label>Username<input id="username" autocomplete="username" value="platewise" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Sign in</button><div id="error" class="error" role="alert"></div></form><div class="foot">Secure personal tracking · Stay signed in for 30 days</div></div><script>document.getElementById('signin').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),error=document.getElementById('error');error.textContent='';btn.disabled=true;try{const res=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!res.ok)throw Error('Incorrect username or password');location.replace('/')}catch(e){error.textContent=e.message;btn.disabled=false}});</script></body></html>
